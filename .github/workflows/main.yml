name: CI Backend

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:

# Si se empuja de nuevo sobre la misma rama, cancela la ejecución anterior
# en lugar de dejar dos pipelines compitiendo.
concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos: solo lectura del repositorio.
permissions:
  contents: read

env:
  # Los tests mockean puppeteer (vi.mock('puppeteer')), así que no hace falta
  # descargar Chromium (~150 MB) en cada instalación.
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  # Un único job con todos los pasos. Antes había 5 jobs encadenados que
  # reinstalaban dependencias 5 veces; así se instala una sola vez.
  ci:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Lint
        run: npm run lint

      - name: Verificar formato
        run: npm run format:check

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Ejecutar pruebas
        run: npm run test

      - name: Compilar proyecto
        run: npm run build

  secrets:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          # Historial completo: Gitleaks escanea también los commits nuevos.
          fetch-depth: 0

      # Escaneo de secretos. Es gratuito en repositorios de usuario;
      # en repositorios de organización requiere GITLEAKS_LICENSE.
      - name: Escaneo de secretos (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
