<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orden de Pago</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; font-size: 11px; color: #000; margin: 0; padding: 8px; }
  .documento { max-width: 210mm; margin: 0 auto; }
  header { margin-bottom: 8px; }
  .logo-row, .title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .logo-ph { border: 1px dashed #000; width: 160px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; letter-spacing: 1px; }
  h1 { font-size: 14px; margin: 6px 0 0; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  section { margin-top: -1px; }
  th, td { border: 1px solid #000; padding: 3px 4px; vertical-align: top; text-align: left; }
  th.sec { font-weight: bold; text-transform: uppercase; }
  th.sec .num { display: inline-block; min-width: 18px; }
  label { display: block; font-size: 8.5px; font-weight: bold; margin-bottom: 1px; text-transform: uppercase; }
  input, select, textarea { width: 100%; font: inherit; border: none; border-bottom: 1px dotted #777; background: transparent; padding: 2px; outline: none; }
  textarea { min-height: 42px; resize: vertical; }
  input:focus, select:focus, textarea:focus { background: #f2f7ff; }
  .amount { text-align: right; }
  .total td { font-size: 13px; font-weight: bold; }
  footer { margin-top: 7px; font-size: 9px; line-height: 1.4; }
  @media (max-width: 640px) { body { padding: 4px; } table, tbody, tr, th, td { display: block; width: 100% !important; } th, td { border-top-width: 0; } tr { border-top: 1px solid #000; } section { margin-top: 6px; } section table { border: 1px solid #000; } }
  @media print { body { padding: 0; } input, select, textarea { border-bottom: none; } }
</style>
</head>
<body>
<form class="documento" onsubmit="return false">
  <header>
    <div class="logo-row"><div class="logo-ph">SUNAT</div></div>
    <div class="title-row"><h1>ORDEN DE PAGO</h1><strong>OP N° <input name="numeroOrden" type="text" style="width:120px" aria-label="Numero de orden"></strong></div>
  </header>

  <section><table>
    <tr><th class="sec" colspan="4"><span class="num">1</span>DATOS DE LA ORDEN</th></tr>
    <tr><td style="width:25%"><label>Numero de orden</label><input name="numeroOrden" type="text"></td><td style="width:25%"><label>Fecha de emision</label><input name="fechaEmision" type="date"></td><td style="width:25%"><label>Fecha de vencimiento</label><input name="fechaVencimiento" type="date"></td><td><label>Periodo tributario</label><input name="periodo" type="text"></td></tr>
    <tr><td colspan="2"><label>Codigo de tributo</label><input name="codigoTributo" type="text"></td><td colspan="2"><label>Base legal</label><input name="baseLegal" type="text"></td></tr>
  </table></section>

  <section><table>
    <tr><th class="sec" colspan="4"><span class="num">2</span>DATOS DEL OBLIGADO</th></tr>
    <tr><td style="width:22%"><label>RUC</label><input name="ruc" type="text" maxlength="11"></td><td colspan="2"><label>Razon social / nombres</label><input name="razonSocial" type="text"></td><td><label>Tipo de contribuyente</label><input name="tipoContribuyente" type="text"></td></tr>
    <tr><td colspan="2"><label>Domicilio fiscal</label><input name="domicilioFiscal" type="text"></td><td><label>Representante legal</label><input name="representanteLegal" type="text"></td><td><label>Documento identidad</label><input name="numeroDocumento" type="text"></td></tr>
  </table></section>

  <section><table>
    <tr><th class="sec" colspan="4"><span class="num">3</span>DEUDA EXIGIBLE</th></tr>
    <tr><td><label>Tributo</label><input name="tributo" type="text"></td><td><label>Periodo</label><input name="periodo" type="text"></td><td><label>Tributo insoluto</label><input name="tributoInsoluto" class="amount" type="number" step="0.01"></td><td><label>Intereses</label><input name="intereses" class="amount" type="number" step="0.01"></td></tr>
    <tr><td><label>Multas</label><input name="multas" class="amount" type="number" step="0.01"></td><td><label>Costas y gastos</label><input name="costasGastos" class="amount" type="number" step="0.01"></td><td><label>Pagos imputados</label><input name="pagosImputados" class="amount" type="number" step="0.01"></td><td><label>Deuda exigible</label><input name="deudaExigible" class="amount" type="number" step="0.01"></td></tr>
    <tr><td colspan="4"><label>Concepto de la deuda</label><textarea name="conceptoDeuda"></textarea></td></tr>
  </table></section>

  <section><table>
    <tr><th class="sec" colspan="3"><span class="num">4</span>TOTAL A PAGAR</th></tr>
    <tr><td style="width:33%"><label>Importe principal</label><input name="importePrincipal" class="amount" type="number" step="0.01"></td><td style="width:33%"><label>Intereses actualizados</label><input name="interesesActualizados" class="amount" type="number" step="0.01"></td><td><label>Fecha de calculo</label><input name="fechaCalculo" type="date"></td></tr>
    <tr class="total"><td colspan="2" class="amount">TOTAL A PAGAR</td><td><input name="totalDeuda" class="amount" type="number" step="0.01"></td></tr>
    <tr><td colspan="3"><label>Instrucciones de pago</label><textarea name="instruccionesPago"></textarea></td></tr>
  </table></section>
  <footer><p>El importe indicado debe ser cancelado dentro del plazo señalado, sin perjuicio de las acciones de cobranza que correspondan.</p><p>Funcionario responsable: ________________________________</p></footer>
</form>
</body>
</html>
