<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Declaracion Jurada Mensual</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; font-size: 11px; color: #000; margin: 0; padding: 8px; }
  .documento { max-width: 210mm; margin: 0 auto; }
  header { margin-bottom: 8px; }
  .logo-row, .title-row, .meta-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .logo-ph { border: 1px dashed #000; width: 160px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; letter-spacing: 1px; }
  h1 { font-size: 14px; margin: 6px 0 0; }
  .meta-row { justify-content: flex-end; margin-top: 6px; font-weight: bold; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  section { margin-top: -1px; }
  th, td { border: 1px solid #000; padding: 3px 4px; vertical-align: top; text-align: left; }
  th.sec { font-weight: bold; text-transform: uppercase; }
  th.sec .num { display: inline-block; min-width: 18px; }
  label { display: block; font-size: 8.5px; font-weight: bold; margin-bottom: 1px; text-transform: uppercase; }
  input, select, textarea { width: 100%; font: inherit; border: none; border-bottom: 1px dotted #777; background: transparent; padding: 2px; outline: none; }
  textarea { min-height: 34px; resize: vertical; }
  input:focus, select:focus, textarea:focus { background: #f2f7ff; }
  .amount { text-align: right; }
  footer { margin-top: 7px; font-size: 9px; line-height: 1.4; }
  @media (max-width: 640px) { body { padding: 4px; } table, tbody, tr, th, td { display: block; width: 100% !important; } th, td { border-top-width: 0; } tr { border-top: 1px solid #000; } section { margin-top: 6px; } section table { border: 1px solid #000; } }
  @media print { body { padding: 0; } input, select, textarea { border-bottom: none; } }
</style>
</head>
<body>
<form class="documento" onsubmit="return false">
  <header>
    <div class="logo-row"><div class="logo-ph">SUNAT</div></div>
    <div class="title-row"><h1>DECLARACION JURADA MENSUAL</h1><strong>N° <input name="numeroDeclaracion" type="text" style="width:110px" aria-label="Numero de declaracion"></strong></div>
    <div class="meta-row">Periodo: <input name="periodo" type="text" style="width:110px" aria-label="Periodo"></div>
  </header>

  <section><table>
    <tr><th class="sec" colspan="4"><span class="num">1</span>DATOS DEL DECLARANTE</th></tr>
    <tr><td style="width:22%"><label>RUC</label><input name="ruc" type="text" maxlength="11"></td><td colspan="2"><label>Razon social</label><input name="razonSocial" type="text"></td><td style="width:24%"><label>Periodo tributario</label><input name="periodo" type="text"></td></tr>
    <tr><td colspan="2"><label>Domicilio fiscal</label><input name="domicilioFiscal" type="text"></td><td><label>Codigo de tributo</label><input name="codigoTributo" type="text"></td><td><label>Regimen tributario</label><input name="regimenTributario" type="text"></td></tr>
  </table></section>

  <section><table>
    <tr><th class="sec" colspan="4"><span class="num">2</span>INGRESOS Y RENTAS</th></tr>
    <tr><td><label>Ingresos gravados</label><input name="ingresosGravados" class="amount" type="number" step="0.01"></td><td><label>Ingresos exonerados</label><input name="ingresosExonerados" class="amount" type="number" step="0.01"></td><td><label>Ingresos inafectos</label><input name="ingresosInafectos" class="amount" type="number" step="0.01"></td><td><label>Total ingresos</label><input name="ingresos" class="amount" type="number" step="0.01"></td></tr>
    <tr><td colspan="2"><label>Renta bruta</label><input name="rentaBruta" class="amount" type="number" step="0.01"></td><td colspan="2"><label>Renta neta</label><input name="rentaNeta" class="amount" type="number" step="0.01"></td></tr>
  </table></section>

  <section><table>
    <tr><th class="sec" colspan="4"><span class="num">3</span>DEDUCCIONES Y GASTOS</th></tr>
    <tr><td><label>Costos y gastos deducibles</label><input name="gastosDeducibles" class="amount" type="number" step="0.01"></td><td><label>Depreciacion</label><input name="depreciacion" class="amount" type="number" step="0.01"></td><td><label>Perdidas compensables</label><input name="perdidasCompensables" class="amount" type="number" step="0.01"></td><td><label>Total deducciones</label><input name="deducciones" class="amount" type="number" step="0.01"></td></tr>
    <tr><td colspan="4"><label>Detalle de deducciones y gastos</label><textarea name="detalleDeducciones"></textarea></td></tr>
  </table></section>

  <section><table>
    <tr><th class="sec" colspan="4"><span class="num">4</span>CALCULO DEL TRIBUTO</th></tr>
    <tr><td><label>Base imponible</label><input name="baseImponible" class="amount" type="number" step="0.01"></td><td><label>Tasa aplicable (%)</label><input name="tasaTributo" class="amount" type="number" step="0.01"></td><td><label>Creditos tributarios</label><input name="creditosTributarios" class="amount" type="number" step="0.01"></td><td><label>Tributo determinado</label><input name="tributoDeterminado" class="amount" type="number" step="0.01"></td></tr>
  </table></section>

  <section><table>
    <tr><th class="sec" colspan="4"><span class="num">5</span>PAGOS REALIZADOS</th></tr>
    <tr><td><label>Pagos a cuenta</label><input name="pagosACuenta" class="amount" type="number" step="0.01"></td><td><label>Retenciones</label><input name="retenciones" class="amount" type="number" step="0.01"></td><td><label>Percepciones</label><input name="percepciones" class="amount" type="number" step="0.01"></td><td><label>Total pagos</label><input name="pagosRealizados" class="amount" type="number" step="0.01"></td></tr>
    <tr><td colspan="2"><label>Numero de constancia</label><input name="numeroConstanciaPago" type="text"></td><td colspan="2"><label>Fecha de pago</label><input name="fechaPago" type="date"></td></tr>
  </table></section>

  <section><table>
    <tr><th class="sec" colspan="3"><span class="num">6</span>RESULTADO</th></tr>
    <tr><td style="width:33%"><label>Saldo a pagar</label><input name="saldoAPagar" class="amount" type="number" step="0.01"></td><td style="width:33%"><label>Saldo a favor</label><input name="saldoAFavor" class="amount" type="number" step="0.01"></td><td><label>Resultado de la declaracion</label><input name="resultado" type="text"></td></tr>
    <tr><td colspan="3"><label>Observaciones</label><textarea name="observaciones"></textarea></td></tr>
  </table></section>
  <footer><p>Declaro que la informacion consignada es verdadera y completa.</p><p>Firma del declarante: ________________________________</p></footer>
</form>
</body>
</html>
