# Ejecución local del backend sin depender del repositorio raíz.
#
#   cp .env.example .env      # completa GEMINI_API_KEY y SUPABASE_SECRET_KEY
#   docker compose up --build
#
# Servicios:
#   api     -> http://localhost:3000
#   worker  -> procesa la cola BullMQ (sin puerto público)
#   redis   -> cola compartida
services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - QUEUE_ENABLED=true
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: node dist/index.js

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - QUEUE_ENABLED=true
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: node dist/workers/document.worker.js

volumes:
  redis_data:
